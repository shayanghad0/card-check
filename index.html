<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بررسی کارت‌ها - فقط کارت‌های زنده</title>

<!-- فونت وزیرمتن -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ریست و پایه */
* {margin:0;padding:0;box-sizing:border-box;}
html {font-size:16px;height:100%;}
body {
  min-height:100vh;
  font-family:'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
  background:#0d0019;
  background:linear-gradient(145deg, #0d0019, #1a0033, #2a0055);
  color:#d0bfff;
  direction:rtl;
  overflow-x:hidden;
  position:relative;
}

/* ذرات پس‌زمینه */
body::before {
  content:'';
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle at 20% 80%, #ff00aa22 0%, transparent 20%),
    radial-gradient(circle at 80% 20%, #00ffff22 0%, transparent 20%),
    radial-gradient(circle at 40% 40%, #aa00ff22 0%, transparent 20%);
  animation:particleMove 25s linear infinite;
  pointer-events:none;
  z-index:0;
}
@keyframes particleMove {
  0% {transform:translate(0,0);}
  100% {transform:translate(100px, -100px);}
}

/* اسکرولبار */
body::-webkit-scrollbar {width:10px;}
body::-webkit-scrollbar-track {background:transparent;}
body::-webkit-scrollbar-thumb {
  background:linear-gradient(#ff00aa, #00ffff);
  border-radius:5px;
  box-shadow:0 0 10px #ff00aa;
}

/* کانتینر */
.container {
  max-width:1000px;
  margin:0 auto;
  padding:20px;
  position:relative;
  z-index:1;
}

/* پنل */
.panel {
  background:rgba(15, 10, 35, 0.5);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(170, 0, 255, 0.4);
  border-radius:24px;
  padding:36px;
  margin:30px 0;
  box-shadow:0 10px 40px rgba(0,0,0,0.6), 0 0 30px rgba(170, 0, 255, 0.3);
  transition:all 0.4s ease;
  position:relative;
  overflow:hidden;
}
.panel::before {
  content:'';
  position:absolute;
  inset:0;
  border-radius:24px;
  padding:2px;
  background:linear-gradient(45deg, #ff00aa, #00ffff, #aa00ff);
  mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite:exclude;
  -webkit-mask-composite:xor;
  pointer-events:none;
  opacity:0.6;
}
.panel:hover {transform:translateY(-10px);}

/* عنوان */
h2.big {
  font-size:3rem;
  font-weight:800;
  text-align:center;
  margin-bottom:24px;
  background:linear-gradient(90deg, #ff00aa, #00ffff, #ff00ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 20px rgba(255, 0, 170, 0.6);
  animation:neonPulse 4s ease infinite;
}

@keyframes neonPulse {
  0%,100% {text-shadow:0 0 20px rgba(255,0,170,0.6);}
  50% {text-shadow:0 0 40px rgba(0,255,255,0.8);}
}

a.big {
  font-size:1rem;
  font-weight:800;
  text-align:center;
  margin-bottom:24px;
  background:linear-gradient(90deg, #ff00aa, #00ffff, #ff00ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 20px rgba(255, 0, 170, 0.6);
  animation:neonPulse 4s ease infinite;
}
@keyframes neonPulse {
  0%,100% {text-shadow:0 0 20px rgba(255,0,170,0.6);}
  50% {text-shadow:0 0 40px rgba(0,255,255,0.8);}
}


p.small {
  font-size:1.05rem;
  opacity:0.9;
  margin-bottom:20px;
  text-align:center;
}

/* textarea */
textarea {
  width:100%;
  height:220px;
  padding:18px;
  border-radius:16px;
  border:2px solid rgba(170, 0, 255, 0.5);
  background:rgba(10, 5, 25, 0.6);
  color:#fff;
  font-size:1.05rem;
  resize:none;
  transition:all 0.4s ease;
}
textarea:focus {
  outline:none;
  border-color:#00ffff;
  box-shadow:0 0 30px rgba(0,255,255,0.4);
}

/* دکمه */
button#main-btn {
  display:block;
  margin:30px auto 0;
  padding:18px 50px;
  font-size:1.3rem;
  font-weight:700;
  color:#000;
  background:linear-gradient(90deg, #ff00aa, #00ffff);
  border:none;
  border-radius:16px;
  cursor:pointer;
  box-shadow:0 0 30px rgba(255,0,170,0.6);
  transition:all 0.4s ease;
  position:relative;
  overflow:hidden;
}
button#main-btn::before {
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transform:translateX(-100%);
  transition:0.6s;
}
button#main-btn:hover::before {transform:translateX(100%);}
button#main-btn:hover {transform:scale(1.05);}
button#main-btn:disabled {opacity:0.7; cursor:not-allowed; transform:none;}

/* پیشرفت بار */
.progress-container {
  width:100%;
  height:12px;
  background:rgba(0,0,0,0.4);
  border-radius:12px;
  margin:25px 0;
  overflow:hidden;
  box-shadow:inset 0 0 10px rgba(0,0,0,0.5);
}
.progress-bar {
  height:100%;
  width:0%;
  background:linear-gradient(90deg, #ff00aa, #00ffff);
  border-radius:12px;
  transition:width 0.4s ease;
  box-shadow:0 0 20px rgba(0,255,255,0.8);
  position:relative;
}
.progress-bar::after {
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation:shimmer 2s linear infinite;
}
@keyframes shimmer {0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
.progress-text {
  text-align:center;
  margin-top:10px;
  font-size:1.1rem;
  color:#00ffff;
  text-shadow:0 0 10px #00ffff;
}

/* فقط کارت‌های زنده نمایش داده می‌شوند */
.card-live {
  padding:20px;
  border-radius:18px;
  margin:14px 0;
  background:rgba(0,255,170,0.15);
  border-left:6px solid #00ffaa;
  border:1px solid rgba(0,255,170,0.4);
  transition:all 0.4s ease;
  cursor:pointer;
  box-shadow:0 5px 20px rgba(0,255,170,0.3);
}
.card-live:hover {
  transform:scale(1.04);
  box-shadow:0 0 40px rgba(0,255,170,0.6);
}

/* شمارنده فقط زنده */
#counts {
  text-align:center;
  font-size:1.4rem;
  font-weight:700;
  margin:30px 0;
  padding:15px;
  background:rgba(0,255,170,0.2);
  border-radius:12px;
  color:#00ffaa;
  text-shadow:0 0 15px #00ffaa;
}

/* مودال */
.detail-modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,20,0.9);
  backdrop-filter:blur(12px);
  justify-content:center;
  align-items:center;
  z-index:1000;
}
.detail-content {
  background:rgba(15,10,40,0.8);
  border:2px solid #00ffff;
  border-radius:28px;
  padding:44px;
  max-width:500px;
  width:90%;
  text-align:center;
  box-shadow:0 0 60px rgba(0,255,255,0.6);
  position:relative;
}
.detail-content h3 {
  font-size:2.4rem;
  margin-bottom:30px;
  color:#00ffff;
  text-shadow:0 0 20px #00ffff;
}
.field {
  margin:20px 0;
  padding:16px;
  background:rgba(0,0,0,0.3);
  border-radius:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:1.2rem;
}
.copy-btn {
  padding:10px 24px;
  background:#ff00aa;
  color:#fff;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
  box-shadow:0 0 20px rgba(255,0,170,0.5);
}
.copy-btn:hover {
  background:#00ffff;
  color:#000;
  transform:scale(1.1);
}
.close-btn {
  position:absolute;
  top:16px;
  left:16px;
  padding:10px 20px;
  background:#ff0066;
  color:#fff;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
}

/* انیمیشن */
@keyframes fadeUp {from {opacity:0; transform:translateY(30px);} to {opacity:1; transform:translateY(0);}}
.fade-in {animation:fadeUp 0.8s ease-out forwards;}

/* ریسپانسیو */
@media (max-width:768px) {
  h2.big {font-size:2.4rem;}
  .panel {padding:28px;}
  textarea {height:180px;}
  button#main-btn {padding:16px 40px; font-size:1.2rem;}
}
</style>
</head>
<body>
<header style="text-align:center;">
  <a href="bin.html"
     class="big"
     style="display:inline-block;padding:10px 20px;text-decoration:none;border:1px solid currentColor;margin:5px;">
    Card Debugger
  </a>

  <a href="https://namso-gen.com/?tab=advance&network=MasterCard"
     class="big"
     style="display:inline-block;padding:10px 20px;text-decoration:none;border:1px solid currentColor;margin:5px;">
    ساخت کارت
  </a>
</header>
<div class="container">
  <div class="panel fade-in">
    <h2 class="big">بررسی کارت‌ها</h2>
    <p class="small">کارت‌ها را وارد کنید (فقط کارت‌های زنده نمایش داده می‌شوند)</p>
    <textarea id="cardInput" placeholder="مثال: 5106984871668155|01|2030|687"></textarea>
    
    <div class="progress-container" id="progressContainer" style="display:none;">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText" style="display:none;">در حال بررسی... 0%</div>
    
    <button id="main-btn">شروع بررسی</button>
  </div>

  <div id="results" class="panel fade-in">
    <h2 class="big" style="font-size:2.4rem;">کارت‌های زنده ✅</h2>
    <div id="counts">تعداد کارت‌های زنده: 0</div>
    <div id="cardsContainer"></div>
  </div>
</div>

<!-- مودال -->
<div id="detailModal" class="detail-modal">
  <div class="detail-content">
    <button class="close-btn" onclick="closeDetail()">بستن ×</button>
    <h3>کارت زنده ✅</h3>
    <div class="field">شماره کارت: <span id="modalCard">xxxxxxxxxxxxxxxx</span> <button class="copy-btn" onclick="copyCard()">کپی</button></div>
    <div class="field">تاریخ انقضا: <span id="modalDate">xx|xxxx</span></div>
    <div class="field">CVV2: <span id="modalCcv">xxx</span></div>
  </div>
</div>

<script>
const detailModal = document.getElementById('detailModal');
function openDetail(card, date, ccv) {
  document.getElementById('modalCard').innerText = card;
  document.getElementById('modalDate').innerText = date;
  document.getElementById('modalCcv').innerText = ccv;
  detailModal.style.display = 'flex';
}
function closeDetail() { detailModal.style.display = 'none'; }
function copyCard() {
  const text = document.getElementById('modalCard').innerText;
  navigator.clipboard.writeText(text);
  alert('شماره کارت کپی شد!');
}

// عناصر پیشرفت
const progressContainer = document.getElementById('progressContainer');
const progressBar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');
const checkBtn = document.getElementById('main-btn');

async function checkCards() {
  const input = document.getElementById('cardInput').value.trim();
  if (!input) return alert('لطفاً کارت‌ها را وارد کنید!');

  const cards = input.split('\n').map(c => c.trim()).filter(c => c);
  if (cards.length === 0) return;

  const container = document.getElementById('cardsContainer');
  container.innerHTML = '';
  
  let liveCount = 0;

  // نمایش پیشرفت
  progressContainer.style.display = 'block';
  progressText.style.display = 'block';
  checkBtn.disabled = true;
  checkBtn.textContent = 'در حال بررسی...';

  for (let i = 0; i < cards.length; i++) {
    const card = cards[i];
    let emoji = '', date = '', ccv = '';

    try {
      const res = await fetch('https://api.chkr.cc/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: card })
      });
      const data = await res.json();

      if (data.code === 1 || (data.status && data.status.toLowerCase() === 'live')) {
        liveCount++;
        emoji = data.emoji || '🌐';
        const parts = card.split('|');
        const cardNumber = parts[0] || '';
        date = parts[1] + '|' + parts[2] || '';
        ccv = parts[3] || '';

        const cardEl = document.createElement('div');
        cardEl.className = 'card-live fade-in';
        cardEl.innerHTML = `✅ ${card} <strong>- زنده!</strong> ${emoji}`;
        cardEl.addEventListener('click', () => openDetail(cardNumber, date, ccv));
        container.appendChild(cardEl);
      }
      // کارت‌های مرده یا ناشناخته نمایش داده نمی‌شوند
    } catch (e) {
      // خطاها هم نمایش داده نمی‌شوند
    }

    // پیشرفت
    const progress = Math.round(((i + 1) / cards.length) * 100);
    progressBar.style.width = progress + '%';
    progressText.textContent = `در حال بررسی... ${progress}% (${i + 1}/${cards.length})`;

    document.getElementById('counts').innerText = `تعداد کارت‌های زنده: ${liveCount}`;
  }

  // پایان
  progressText.textContent = 'بررسی کامل شد!';
  setTimeout(() => {
    progressContainer.style.display = 'none';
    progressText.style.display = 'none';
  }, 2000);

  checkBtn.disabled = false;
  checkBtn.textContent = 'شروع بررسی';

  if (liveCount === 0) {
    container.innerHTML = '<p style="text-align:center; opacity:0.8; margin:50px 0; font-size:1.2rem;">هیچ کارت زنده‌ای یافت نشد 😔</p>';
  }
}

document.getElementById('main-btn').addEventListener('click', checkCards);
</script>
<p style="text-align:center;color:#acbd8e;">
  <span style="cursor:pointer;"
        onmouseover="this.querySelector('span').style.display='inline';"
        onmouseout="this.querySelector('span').style.display='none';">
    Create By Shayan Ghadamian
    <span style="display:none;margin-left:10px;color:#acbd8e;">
      <a href="https://github.com/shayanghad0" style="color:#acbd8e;text-decoration:none;margin-right:6px;">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/github.svg"
             style="width:16px;vertical-align:middle;filter:invert(65%) sepia(45%) saturate(2361%) hue-rotate(87deg) brightness(96%) contrast(90%);">
      </a>
      <a href="https://t.me/shayanghad0" style="color:#acbd8e;text-decoration:none;margin-left:6px;">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/telegram.svg"
             style="width:16px;vertical-align:middle;filter:invert(65%) sepia(45%) saturate(2361%) hue-rotate(87deg) brightness(96%) contrast(90%);">
      </a>
    </span>
  </span>
</p>


</body>
</html>
